<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif">
  <!-- paper -->
  <rect x="0" y="0" width="1160" height="600" fill="#F5F0E6"/>
  <rect x="12" y="12" width="1136" height="576" rx="16" fill="none" stroke="#D9D0BE" stroke-width="1.5"/>

  <!-- divider -->
  <line x1="580" y1="86" x2="580" y2="558" stroke="#D9D0BE" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- captions -->
  <rect x="150" y="34" width="284" height="36" rx="18" fill="#ECE5D6" stroke="#2A241C" stroke-width="1.5"/>
  <text x="292" y="58" text-anchor="middle" font-size="16" fill="#2A241C">従来 — WordPress ごと納品</text>

  <rect x="726" y="34" width="284" height="36" rx="18" fill="#2A241C"/>
  <text x="868" y="58" text-anchor="middle" font-size="16" fill="#F5F0E6">Distan — 静的HTMLだけ納品</text>

  <!-- ===================== LEFT: before ===================== -->
  <!-- burden chips -->
  <g fill="#F3E3DE" stroke="#B15540" stroke-width="1.4">
    <rect x="150" y="128" width="86" height="30" rx="15"/>
    <rect x="244" y="128" width="128" height="30" rx="15"/>
    <rect x="380" y="128" width="104" height="30" rx="15"/>
  </g>
  <g fill="#B15540" font-size="13" text-anchor="middle">
    <text x="193" y="148">！更新</text>
    <text x="308" y="148">！脆弱性対応</text>
    <text x="432" y="148">！環境依存</text>
  </g>

  <!-- client server (heavy) -->
  <rect x="167" y="190" width="250" height="232" rx="14" fill="#FBF7EE" stroke="#2A241C" stroke-width="2"/>
  <!-- WordPress header -->
  <rect x="192" y="210" width="200" height="44" rx="8" fill="#C79A5E" stroke="#9B7440" stroke-width="1.5"/>
  <text x="292" y="238" text-anchor="middle" font-size="17" font-weight="bold" fill="#2A241C">WordPress</text>
  <!-- stacked layers -->
  <g fill="#EFE8DA" stroke="#C9BFA9" stroke-width="1.2">
    <rect x="192" y="264" width="200" height="34" rx="6"/>
    <rect x="192" y="304" width="200" height="34" rx="6"/>
    <rect x="192" y="344" width="200" height="34" rx="6"/>
  </g>
  <g fill="#4A4235" font-size="13.5" text-anchor="middle">
    <text x="292" y="286">管理画面・ログイン</text>
    <text x="292" y="326">データベース</text>
    <text x="292" y="366">プラグイン</text>
  </g>
  <text x="292" y="404" text-anchor="middle" font-size="12" fill="#8A8073">クライアントのサーバー</text>

  <text x="292" y="462" text-anchor="middle" font-size="13.5" fill="#6B6152">動く WordPress が本番に残り続ける。</text>
  <text x="292" y="483" text-anchor="middle" font-size="13.5" fill="#6B6152">更新も脆弱性対応もずっと付いてくる。</text>

  <!-- ===================== RIGHT: after ===================== -->
  <!-- workshop (kept local) -->
  <rect x="626" y="250" width="132" height="110" rx="12" fill="#FBF7EE" stroke="#2A241C" stroke-width="2"/>
  <rect x="646" y="268" width="92" height="30" rx="6" fill="#C79A5E" stroke="#9B7440" stroke-width="1.3"/>
  <text x="692" y="289" text-anchor="middle" font-size="14" font-weight="bold" fill="#2A241C">WordPress</text>
  <text x="692" y="330" text-anchor="middle" font-size="12.5" fill="#4A4235">手元の工房</text>
  <text x="692" y="392" text-anchor="middle" font-size="12" fill="#8A8073">作る場所（残す）</text>

  <!-- arrow workshop -> server -->
  <text x="838" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#2A241C">Distan</text>
  <line x1="770" y1="330" x2="892" y2="330" stroke="#2A241C" stroke-width="2.4"/>
  <polygon points="892,322 912,330 892,338" fill="#2A241C"/>

  <!-- kraft box (dist/) riding the arrow -->
  <g>
    <rect x="812" y="284" width="56" height="40" rx="3" fill="#C79A5E" stroke="#9B7440" stroke-width="2"/>
    <line x1="812" y1="298" x2="868" y2="298" stroke="#9B7440" stroke-width="1.3"/>
    <line x1="840" y1="284" x2="840" y2="298" stroke="#9B7440" stroke-width="1.3"/>
    <text x="840" y="317" text-anchor="middle" font-size="12" fill="#2A241C">dist/</text>
  </g>

  <!-- client server (light, static) -->
  <rect x="928" y="212" width="184" height="196" rx="14" fill="#FBF7EE" stroke="#2A241C" stroke-width="2"/>
  <g fill="#F3EFE6" stroke="#C9BFA9" stroke-width="1.2">
    <rect x="958" y="236" width="124" height="34" rx="4"/>
    <rect x="958" y="282" width="124" height="34" rx="4"/>
    <rect x="958" y="328" width="124" height="34" rx="4"/>
  </g>
  <g fill="#4A4235" font-size="12.5" text-anchor="middle">
    <text x="1020" y="258">index.html</text>
    <text x="1020" y="304">about/…</text>
    <text x="1020" y="350">news/…</text>
  </g>
  <text x="1020" y="392" text-anchor="middle" font-size="12" fill="#8A8073">クライアントのサーバー</text>

  <!-- positive chips -->
  <g fill="#E7EDDD" stroke="#6F7B52" stroke-width="1.4">
    <rect x="632" y="436" width="104" height="30" rx="15"/>
    <rect x="746" y="436" width="98" height="30" rx="15"/>
    <rect x="854" y="436" width="150" height="30" rx="15"/>
  </g>
  <g fill="#55603F" font-size="13" text-anchor="middle">
    <text x="684" y="456">✓ PHP 不要</text>
    <text x="795" y="456">✓ DB 不要</text>
    <text x="929" y="456">✓ どこにでも置ける</text>
  </g>

  <text x="820" y="498" text-anchor="middle" font-size="13.5" fill="#6B6152">本番は静的HTMLだけ。工房（WordPress）は手元に残す。</text>
</svg>
