<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic',sans-serif">
  <rect x="0" y="0" width="1200" height="420" fill="#FFFFFF"/>
  <rect x="14" y="14" width="1172" height="392" rx="16" fill="none" stroke="#E0E0E0" stroke-width="1.5"/>

  <!-- ================= LEFT : 従来 / HEADFULL ================= -->
  <g>
    <rect x="72" y="44" width="472" height="332" rx="14" fill="#FFFFFF" stroke="#DADADA" stroke-width="1.5"/>
    <!-- row1: title band -->
    <text x="96" y="82" font-size="13" letter-spacing="2" fill="#8A8A8A" font-weight="700">従来 — HEADFULL</text>
    <text x="96" y="112" font-size="21" font-weight="700" fill="#111111">WordPress ごと本番に置く</text>
    <line x1="96" y1="128" x2="520" y2="128" stroke="#EDEDED" stroke-width="1"/>
    <!-- row2: diagram zone (server stack), fixed band y=148..286 -->
    <rect x="96" y="148" width="424" height="138" rx="10" fill="#F7F7F7" stroke="#DADADA" stroke-width="1.5"/>
    <text x="308" y="172" font-size="12" fill="#8A8A8A" text-anchor="middle" letter-spacing="1">クライアントのサーバー</text>
    <rect x="120" y="186" width="376" height="28" rx="6" fill="#FFFFFF" stroke="#CFCFCF" stroke-width="1"/>
    <text x="308" y="205" font-size="13" fill="#333333" text-anchor="middle">管理画面・ログイン</text>
    <rect x="120" y="220" width="376" height="28" rx="6" fill="#FFFFFF" stroke="#CFCFCF" stroke-width="1"/>
    <text x="308" y="239" font-size="13" fill="#333333" text-anchor="middle">データベース</text>
    <rect x="120" y="254" width="376" height="28" rx="6" fill="#FFFFFF" stroke="#CFCFCF" stroke-width="1"/>
    <text x="308" y="273" font-size="13" fill="#333333" text-anchor="middle">プラグイン</text>
    <!-- row3: tag row, fixed band y=300..332 -->
    <g font-size="13" font-weight="700">
      <rect x="96" y="300" width="134" height="32" rx="16" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.2"/>
      <text x="163" y="321" fill="#111111" text-anchor="middle">！ 更新</text>
      <rect x="241" y="300" width="150" height="32" rx="16" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.2"/>
      <text x="316" y="321" fill="#111111" text-anchor="middle">！ 脆弱性対応</text>
      <rect x="402" y="300" width="118" height="32" rx="16" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1.2"/>
      <text x="461" y="321" fill="#111111" text-anchor="middle">！ 環境依存</text>
    </g>
    <!-- row4: caption -->
    <text x="96" y="360" font-size="13" fill="#6E6E6E">動く WordPress が残り、保守がずっと付いてくる。</text>
  </g>

  <!-- center arrow -->
  <g>
    <circle cx="600" cy="210" r="24" fill="#111111"/>
    <path d="M591 210 h15 M600 202 l9 8 -9 8" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ================= RIGHT : ヘッドロス / HEAD ONLY ================= -->
  <g>
    <rect x="656" y="44" width="472" height="332" rx="14" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <!-- row1: title band -->
    <text x="680" y="82" font-size="13" letter-spacing="2" fill="#111111" font-weight="700">ヘッドロス — HEAD ONLY</text>
    <text x="680" y="112" font-size="21" font-weight="700" fill="#111111">静的HTMLだけ本番に置く</text>
    <line x1="680" y1="128" x2="1104" y2="128" stroke="#EDEDED" stroke-width="1"/>
    <!-- row2: diagram zone (workshop -> distan -> server), same band y=148..286 -->
    <rect x="680" y="148" width="196" height="138" rx="10" fill="#F7F7F7" stroke="#DADADA" stroke-width="1.5"/>
    <text x="778" y="172" font-size="12" fill="#8A8A8A" text-anchor="middle" letter-spacing="1">手元の工房</text>
    <rect x="700" y="186" width="156" height="40" rx="8" fill="#FFFFFF" stroke="#CFCFCF" stroke-width="1"/>
    <text x="778" y="205" font-size="13" fill="#333333" text-anchor="middle" font-weight="700">WordPress</text>
    <text x="778" y="220" font-size="10" fill="#8A8A8A" text-anchor="middle">作る場所（残す）</text>
    <rect x="700" y="234" width="156" height="40" rx="8" fill="#111111"/>
    <text x="778" y="253" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700">Distan</text>
    <text x="778" y="268" font-size="10" fill="#C9C9C9" text-anchor="middle">書き出す</text>

    <path d="M888 217 h16 M900 210 l8 7 -8 7" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="920" y="148" width="184" height="138" rx="10" fill="#F7F7F7" stroke="#111111" stroke-width="1.5"/>
    <text x="1012" y="172" font-size="12" fill="#8A8A8A" text-anchor="middle" letter-spacing="1">クライアントのサーバー</text>
    <rect x="944" y="186" width="136" height="26" rx="6" fill="#FFFFFF" stroke="#CFCFCF" stroke-width="1"/>
    <text x="1012" y="204" font-size="12" fill="#333333" text-anchor="middle">index.html</text>
    <rect x="944" y="218" width="136" height="26" rx="6" fill="#FFFFFF" stroke="#CFCFCF" stroke-width="1"/>
    <text x="1012" y="236" font-size="12" fill="#333333" text-anchor="middle">about/ …</text>
    <rect x="944" y="250" width="136" height="26" rx="6" fill="#FFFFFF" stroke="#CFCFCF" stroke-width="1"/>
    <text x="1012" y="268" font-size="12" fill="#333333" text-anchor="middle">news/ …</text>
    <!-- row3: tag row, same band y=300..332 -->
    <g font-size="13" font-weight="700">
      <rect x="680" y="300" width="134" height="32" rx="16" fill="#111111"/>
      <text x="747" y="321" fill="#FFFFFF" text-anchor="middle">✓ PHP 不要</text>
      <rect x="825" y="300" width="122" height="32" rx="16" fill="#111111"/>
      <text x="886" y="321" fill="#FFFFFF" text-anchor="middle">✓ DB 不要</text>
      <rect x="958" y="300" width="146" height="32" rx="16" fill="#111111"/>
      <text x="1031" y="321" fill="#FFFFFF" text-anchor="middle">✓ どこにでも</text>
    </g>
    <!-- row4: caption -->
    <text x="680" y="360" font-size="13" fill="#6E6E6E">頭（静的HTML）だけ送り、胴体（WordPress）は工房に。</text>
  </g>
</svg>
